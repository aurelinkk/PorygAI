<text x="60" y="32.8" font-size="32" fill="#1a1526" text-anchor="start" font-weight="700">Questionnaire d'évaluation Poryg'AI — v2</text>
<text x="60" y="62.3" font-size="14" fill="#6b6280" text-anchor="start" font-weight="400">Arbre de décision : le cadrage détermine les questions posées, donc le score et le verdict.</text>
<text x="60" y="79.8" font-size="14" fill="#6b6280" text-anchor="start" font-weight="400">● = question critique (un « Non » plafonne le score à 60)     ⛔ = question bloquante (évaluation refusée)</text>
<text x="76" y="141.4" font-size="17" fill="#1a1526" text-anchor="start" font-weight="700">①  CADRAGE — 6 questions, non notées</text>
<text x="205" y="227.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">C1 · Pays de déploiement</text>
<text x="205" y="242.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="205" y="257.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">UE · US · Chine · Autre</text>
<text x="205" y="272.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">(choix multiple)</text>
<text x="447" y="227.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">C2 · Usage militaire,</text>
<text x="447" y="242.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">défense, sécurité nat. ?   ⛔</text>
<text x="447" y="257.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="447" y="272.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">Oui → refus immédiat</text>
<text x="689" y="227.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">C3 · Domaine à fort enjeu ?</text>
<text x="689" y="242.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="689" y="257.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">santé · biométrie · emploi</text>
<text x="689" y="272.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">éducation · crédit · justice</text>
<text x="931" y="227.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">C4 · Données</text>
<text x="931" y="242.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">personnelles ?</text>
<text x="931" y="257.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="931" y="272.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">Oui / Non</text>
<text x="1173" y="227.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">C5 · Génère du contenu</text>
<text x="1173" y="242.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">ou interagit ?</text>
<text x="1173" y="257.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="1173" y="272.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">génère · interagit · les deux</text>
<text x="1415" y="227.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">C6 · Origine du modèle</text>
<text x="1415" y="242.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="1415" y="257.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">interne · fine-tuné</text>
<text x="1415" y="272.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">API tierce · poids ouverts</text>
<text x="90" y="363.3" font-size="13" fill="#6b6280" text-anchor="start" font-weight="400">Chaque réponse active ou masque des questions (`showIf`). Une question masquée ne compte ni dans les points obtenus, ni dans les points applicables.</text>
<text x="1385" y="415.2" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">⛔  SORTIES IMMÉDIATES</text>
<text x="1385" y="431.4" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="1385" y="447.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">C2 = Oui  →  REFUSÉE</text>
<text x="1385" y="463.9" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">hors périmètre de la politique IA</text>
<text x="1385" y="480.2" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="1385" y="496.4" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">UE1 = Oui  →  REFUSÉE</text>
<text x="1385" y="512.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">pratique interdite (AI Act art. 5)</text>
<text x="1385" y="529.0" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="1385" y="545.2" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">Aucun score n'est calculé.</text>
<text x="803" y="356.8" font-size="12" fill="#e5384f" text-anchor="start" font-weight="400">Oui</text>
<text x="76" y="411.4" font-size="17" fill="#1a1526" text-anchor="start" font-weight="700">②  THÈMES NOTÉS</text>
<text x="260" y="483.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">① Nécessité &amp; proportionnalité</text>
<text x="260" y="498.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">N1● N2 N3   —   8 pts</text>
<text x="260" y="513.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">toujours posé</text>
<text x="615" y="483.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">② Données &amp; vie privée</text>
<text x="615" y="498.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">D1● D2 D3 D4● D5 D6   —   15 pts</text>
<text x="615" y="513.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">5 questions sur 6 selon C4 / C3 / C6</text>
<text x="970" y="483.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">③ Transparence &amp; explicabilité</text>
<text x="970" y="498.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">T1● T2 T3 T4   —   9 pts</text>
<text x="970" y="513.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">T1 · T3 si C5</text>
<text x="260" y="590.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">④ Supervision &amp; robustesse</text>
<text x="260" y="605.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">S1● S2 S3 S4 S5   —   12 pts</text>
<text x="260" y="620.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">S2 · S5 si C3</text>
<text x="615" y="590.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">⑤ Équité &amp; biais</text>
<text x="615" y="605.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">E1 E2 E3   —   5 pts</text>
<text x="615" y="620.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">E2 si C3 — biais cognitifs à venir ici</text>
<text x="970" y="590.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">⑥ Sécurité</text>
<text x="970" y="605.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">SE1 SE2 SE3   —   6 pts</text>
<text x="970" y="620.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">SE2 si C5 · SE3 si C6 = API</text>
<text x="260" y="697.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">⑦ Frugalité &amp; FinOps</text>
<text x="260" y="712.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">F1 F2 F3 F4 F5   —   8 pts</text>
<text x="260" y="727.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">toujours posé</text>
<text x="76" y="781.4" font-size="17" fill="#1a1526" text-anchor="start" font-weight="700">③  RÉGLEMENTATION — un bloc par pays coché en C1, avec sa propre barre d'avancement</text>
<text x="268" y="850.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">Union européenne   —   14 pts</text>
<text x="268" y="865.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">UE1⛔ UE2 UE3● UE4</text>
<text x="268" y="880.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">UE5 UE6 UE7 UE8</text>
<text x="268" y="895.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">AI Act · RGPD</text>
<text x="634" y="850.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">États-Unis   —   20 pts</text>
<text x="634" y="865.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">US1● US2● US3● US4</text>
<text x="634" y="880.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">US5 US6 US7</text>
<text x="634" y="895.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">sectoriel · lois d'État · FTC</text>
<text x="1002" y="850.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">Chine   —   18 pts</text>
<text x="1002" y="865.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">CN1● CN2 CN3 CN4●</text>
<text x="1002" y="880.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">CN5 CN6 CN7</text>
<text x="1002" y="895.3" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">CAC · marquage · PIPL</text>
<text x="1368" y="857.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">Autres pays   —   2 pts</text>
<text x="1368" y="872.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">AU1</text>
<text x="1368" y="887.8" font-size="12" fill="#1a1526" text-anchor="middle" font-weight="400">revue juridique locale</text>
<text x="810" y="1038.3" font-size="14" fill="#1a1526" text-anchor="middle" font-weight="400">④   Score  =  100 × points obtenus ÷ points applicables</text>
<text x="810" y="1055.8" font-size="14" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="810" y="1073.3" font-size="14" fill="#1a1526" text-anchor="middle" font-weight="400">Poids :  critique ● 4 pts    ·    standard 2 pts    ·    mineur 1 pt</text>
<text x="810" y="1090.8" font-size="14" fill="#1a1526" text-anchor="middle" font-weight="400">Une question critique ● répondue « Non »  →  score plafonné à 60</text>
<text x="410" y="1222.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">≥ 86    CONFORME</text>
<text x="410" y="1239.0" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="410" y="1255.2" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">Déployable en production</text>
<text x="410" y="1271.5" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">Échéance : 12 mois</text>
<text x="410" y="1287.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">puis retour en audit</text>
<text x="840" y="1222.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">61 – 85    PARTIELLEMENT CONFORME</text>
<text x="840" y="1239.0" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="840" y="1255.2" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">Autorisée en test / pilote</text>
<text x="840" y="1271.5" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">Sans échéance :</text>
<text x="840" y="1287.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">jusqu'à réévaluation</text>
<text x="1270" y="1222.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">≤ 60    NON CONFORME</text>
<text x="1270" y="1239.0" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400"></text>
<text x="1270" y="1255.2" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">Non déployable</text>
<text x="1270" y="1271.5" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">Plan d'action généré</text>
<text x="1270" y="1287.7" font-size="13" fill="#1a1526" text-anchor="middle" font-weight="400">(une action par point perdu)</text>
<text x="1336" y="872.3" font-size="12" fill="#e5384f" text-anchor="start" font-weight="400">refus</text>
<text x="210" y="1353.3" font-size="13" fill="#6b6280" text-anchor="start" font-weight="400">Recommandations : chaque réponse en dessous du maximum produit une action corrective, classée par points récupérables (critiques d'abord).</text>
<text x="210" y="1369.6" font-size="13" fill="#6b6280" text-anchor="start" font-weight="400">Elles alimentent le plan d'action de l'application, sauf si le verdict est « Conforme ».</text>
<text x="210" y="1385.8" font-size="13" fill="#6b6280" text-anchor="start" font-weight="400"></text>
<text x="210" y="1402.1" font-size="13" fill="#6b6280" text-anchor="start" font-weight="400">Source de vérité : shared/src/questionnaire.ts  —  conception détaillée : docs/questionnaire-v2.md</text>
</svg>